<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Teste com Gradient Cósmico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: #fff;
      background: 
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url('https://images.unsplash.com/photo-1557683316-973673baf926') 
        center/cover no-repeat fixed;
      background-color: #0f0f1f; /* fallback se imagem falhar */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      background: rgba(30, 30, 50, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(180, 140, 255, 0.15);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      color: #5865f2; /* cor do Discord */
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }

    p.subtitle {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    input {
      width: 100%;
      padding: 1rem;
      margin: 0.8rem 0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(40,40,60,0.7);
      color: #fff;
      font-size: 1rem;
    }

    input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      margin: 1.5rem 0 1rem;
      background: #5865f2;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #4752c4;
    }

    .links {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .links a {
      color: #5865f2;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container { padding: 2rem 1.5rem; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">Discord</div>
    
    <h1>Entrar</h1>
    <p class="subtitle">Faça login com seu e-mail ou telefone.</p>
    
    <form>
      <input type="text" placeholder="E-mail ou número de telefone" required />
      <input type="password" placeholder="Senha" required />
      <button type="submit" class="btn">Continuar</button>
    </form>
    
    <div class="links">
      <a href="#">Sign Up</a> • <a href="#">Esqueceu sua senha?</a>
    </div>
  </div>

</body>
</html>
