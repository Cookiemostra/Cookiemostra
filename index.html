<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gradient Cósmico - Teste Completo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #f0f0ff;
      background: 
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1920&auto=format&fit=crop') 
        center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .container {
      background: rgba(15, 15, 35, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(200, 180, 255, 0.12);
      border-radius: 24px;
      padding: 4rem 3rem;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(100, 80, 200, 0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .container:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.7),
        inset 0 0 40px rgba(120, 100, 220, 0.12);
    }

    h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 1.2rem;
      background: linear-gradient(90deg, #d8b4fe, #c084fc, #a78bfa, #7dd3fc, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: gradientFlow 8s linear infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    p {
      font-size: 1.3rem;
      line-height: 1.7;
      opacity: 0.92;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(90deg, #8b5cf6, #7c3aed, #6d28d9);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 1.2rem 3rem;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.4s ease;
      box-shadow: 0 12px 30px rgba(139, 92, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.6s;
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.6);
    }

    @media (max-width: 640px) {
      .container {
        padding: 3rem 2rem;
      }
      h1 {
        font-size: 2.8rem;
      }
      p {
        font-size: 1.15rem;
      }
      .btn {
        padding: 1rem 2.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bem-vindo ao Futuro</h1>
    <p>
      Background cósmico direto do link que você mandou — aquele gradient roxo-azulado nebuloso, perfeito pra vibes dark mode, login screens, apps ou sites premium. 
      Tudo com glassmorphism suave, hover effects e animação no título.
    </p>
    <a href="#" class="btn">Explorar Agora</a>
  </div>

</body>
</html>
